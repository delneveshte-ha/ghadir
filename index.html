<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>روزنامه دیواری غدیر | دلنوشته‌هایی برای مولای متقیان</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Tahoma', 'Vazirmatn', sans-serif;
      background: #2b1e10;
      background-image: radial-gradient(circle at 20% 30%, #3d2b1a 5%, #1f1408 90%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      margin: 0;
    }

    .outer-frame {
      background: #d4af37;
      background-image: linear-gradient(145deg, #f3e5ab 0%, #b8860b 50%, #8b6508 100%);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 2px 10px rgba(255,255,200,0.6);
      border: 4px solid #6b4c1a;
      width: 100%;
      max-width: 950px;
    }

    .inner-frame {
      background: #fdf5e6;
      padding: 30px 25px;
      border-radius: 6px;
      box-shadow: inset 0 0 30px rgba(139, 69, 19, 0.5);
      border: 2px dashed #b8860b;
    }

    .title-section {
      text-align: center;
      margin-bottom: 25px;
    }

    .main-title {
      font-size: 4.5rem;
      font-weight: 900;
      color: #1e4d2b;
      text-shadow: 3px 3px 0 #d4af37, 5px 5px 10px rgba(0,0,0,0.3);
      letter-spacing: 5px;
      margin: 0;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 1.3rem;
      color: #5c3a1f;
      margin-top: 5px;
      font-weight: 500;
      background: rgba(212, 175, 55, 0.2);
      display: inline-block;
      padding: 5px 25px;
      border-radius: 30px;
    }

    .bulletin-board {
      background: rgba(210, 180, 140, 0.25);
      border-radius: 15px;
      padding: 20px;
      margin: 20px 0 25px;
      min-height: 300px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 15px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
      border: 1px solid #c9a86b;
      background-image: radial-gradient(circle, #e7d3b5 1px, transparent 1px);
      background-size: 30px 30px;
    }

    .note-card {
      width: 130px;
      min-height: 130px;
      padding: 15px 10px;
      box-shadow: 3px 4px 8px rgba(0,0,0,0.35);
      font-size: 0.8rem;
      line-height: 1.5;
      word-break: break-word;
      transition: transform 0.2s;
      cursor: default;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #2c2416;
      font-weight: 500;
      border-radius: 3px;
      transform: rotate(var(--rot, 0deg));
      animation: fadeIn 0.4s ease-out;
    }

    .note-card:hover {
      transform: rotate(var(--rot, 0deg)) scale(1.05);
      box-shadow: 5px 7px 12px rgba(0,0,0,0.5);
      z-index: 5;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.7) rotate(var(--rot, 0deg)); }
      100% { opacity: 1; transform: scale(1) rotate(var(--rot, 0deg)); }
    }

    .note-author {
      font-weight: bold;
      font-size: 0.8rem;
      margin-top: 5px;
      color: #4a2c0f;
      border-top: 1px dashed rgba(0,0,0,0.2);
      padding-top: 5px;
      width: 100%;
    }

    .note-text {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-style: italic;
    }

    .color1 { background: #fdeaa8; }
    .color2 { background: #b8e6c8; }
    .color3 { background: #f9c7b7; }
    .color4 { background: #c7dff5; }
    .color5 { background: #e6c9e0; }
    .color6 { background: #fcd9b8; }

    .form-section {
      background: rgba(255, 248, 235, 0.75);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 20px;
      margin-top: 15px;
      border: 2px solid #d4af37;
      box-shadow: 0 8px 18px rgba(0,0,0,0.3);
    }

    .form-title {
      font-size: 1.3rem;
      margin-bottom: 12px;
      color: #3b2b10;
      font-weight: bold;
      text-align: center;
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .input-field {
      flex: 1 1 180px;
      padding: 12px 15px;
      border-radius: 30px;
      border: 1px solid #c9a86b;
      font-family: inherit;
      background: #fffef7;
      font-size: 0.9rem;
    }

    .color-picker-label {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 200px;
      font-size: 0.9rem;
      color: #4a3520;
    }

    .color-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .color-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    
    .color-circle.selected {
      border: 3px solid #2c3e1a;
      transform: scale(1.15);
      box-shadow: 0 0 10px gold;
    }

    .btn-submit {
      background: linear-gradient(135deg, #2c5e2e, #0f3b1a);
      border: none;
      color: white;
      padding: 14px 30px;
      border-radius: 40px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
      box-shadow: 0 6px 0 #0a1f0e;
      letter-spacing: 1px;
      border: 1px solid #d4af37;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #367a39, #1e4d2b);
      box-shadow: 0 4px 0 #0a1f0e;
      transform: translateY(2px);
    }

    .message-counter {
      text-align: center;
      margin: 10px 0;
      color: #4b3621;
      font-weight: 500;
    }

    @media (max-width: 600px) {
      .outer-frame {
        padding: 12px;
      }
      .main-title {
        font-size: 3rem;
      }
      .note-card {
        width: 100px;
        min-height: 110px;
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
<div class="outer-frame">
  <div class="inner-frame">
    <div class="title-section">
      <h1 class="main-title">غدیر</h1>
      <div class="subtitle">📜 دلنوشته‌هایی برای امیرالمؤمنین علی (ع) 📜</div>
    </div>

    <div id="bulletinBoard" class="bulletin-board">
    </div>

    <div class="message-counter">تاکنون <span id="noteCount">0</span> دلنوشته به این روزنامه دیواری اضافه شده است.</div>

    <div class="form-section">
      <div class="form-title">✍️ دلنوشته خود را بنویسید و به روزنامه دیواری بپیوندید</div>
      <div class="input-group">
        <input type="text" id="authorName" class="input-field" placeholder="نام شما..." maxlength="25">
        <div class="color-picker-label">
          <span>رنگ کاغذ:</span>
          <div class="color-options" id="colorPicker">
            <span class="color-circle color1" data-color="color1" style="background:#fdeaa8;"></span>
            <span class="color-circle color2" data-color="color2" style="background:#b8e6c8;"></span>
            <span class="color-circle color3" data-color="color3" style="background:#f9c7b7;"></span>
            <span class="color-circle color4 selected" data-color="color4" style="background:#c7dff5;"></span>
            <span class="color-circle color5" data-color="color5" style="background:#e6c9e0;"></span>
            <span class="color-circle color6" data-color="color6" style="background:#fcd9b8;"></span>
          </div>
        </div>
      </div>
      <textarea id="noteText" class="input-field" rows="3" placeholder="دلنوشته خود را خطاب به حضرت علی (ع) بنویسید..." maxlength="160" style="width:100%; resize:vertical;"></textarea>
      <button class="btn-submit" id="submitBtn">🕊️ ثبت دلنوشته بر روی روزنامه دیواری</button>
    </div>
  </div>
</div>

<script>
  (function() {
    const board = document.getElementById('bulletinBoard');
    const authorInput = document.getElementById('authorName');
    const noteInput = document.getElementById('noteText');
    const submitBtn = document.getElementById('submitBtn');
    const noteCountSpan = document.getElementById('noteCount');
    const colorPicker = document.getElementById('colorPicker');

    let selectedColor = 'color4';

    const initialNotes = [
      { author: "محمد", text: "ای مولای من، غدیر روز کمال دین است. تو جان پیامبری.", color: "color1" },
      { author: "فاطمه", text: "علی جان، عشق تو در قلبم جاودانه است. عیدت مبارک.", color: "color3" },
      { author: "امیرعلی", text: "هر روز با یاد تو آغاز می‌کنم. یا امیرالمؤمنین.", color: "color6" },
      { author: "زهرا", text: "غدیر یعنی علی مولای همه خوبی‌هاست.", color: "color2" },
      { author: "حسین", text: "اگر هزار بار هم بگویم علی، کم گفته‌ام.", color: "color5" },
      { author: "نرگس", text: "خوشا به حال غدیر که نام علی را یدک می‌کشد.", color: "color4" }
    ];

    let notes = [];

    function saveNotesToStorage() {
      localStorage.setItem('ghadir_notes', JSON.stringify(notes));
    }

    function loadNotesFromStorage() {
      const stored = localStorage.getItem('ghadir_notes');
      if (stored) {
        try {
          notes = JSON.parse(stored);
        } catch(e) {
          notes = [...initialNotes];
        }
      } else {
        notes = [...initialNotes];
      }
      if (!notes.length) notes = [...initialNotes];
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function renderAllNotes() {
      board.innerHTML = '';
      if (!notes.length) {
        board.innerHTML = '<div style="width:100%; text-align:center; color:#6b4f32; padding:40px; font-style:italic;">هنوز دلنوشته‌ای ثبت نشده. اولین نفر باشید...</div>';
        noteCountSpan.textContent = '0';
        return;
      }

      notes.forEach((note) => {
        const card = document.createElement('div');
        card.className = 'note-card ' + note.color;
        const randomRot = (Math.random() * 6 - 3).toFixed(1);
        card.style.setProperty('--rot', randomRot + 'deg');
        
        card.innerHTML = '<div class="note-text">' + escapeHtml(note.text) + '</div><div class="note-author">✤ ' + escapeHtml(note.author) + '</div>';
        board.appendChild(card);
      });

      noteCountSpan.textContent = notes.length;
      saveNotesToStorage();
    }

    function addNote() {
      const author = authorInput.value.trim();
      const text = noteInput.value.trim();

      if (!author) {
        alert('لطفاً نام خود را وارد کنید.');
        authorInput.focus();
        return;
      }
      if (!text) {
        alert('لطفاً متن دلنوشته خود را بنویسید.');
        noteInput.focus();
        return;
      }
      if (text.length < 3) {
        alert('دلنوشته کمی طولانی‌تر بنویسید (حداقل ۳ حرف).');
        noteInput.focus();
        return;
      }

      notes.push({
        author: author,
        text: text,
        color: selectedColor
      });

      renderAllNotes();
      authorInput.value = '';
      noteInput.value = '';
      authorInput.focus();
    }

    colorPicker.addEventListener('click', (e) => {
      const circle = e.target.closest('.color-circle');
      if (!circle) return;
      
      document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('selected'));
      circle.classList.add('selected');
      selectedColor = circle.dataset.color;
    });

    submitBtn.addEventListener('click', addNote);

    noteInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        addNote();
      }
    });

    loadNotesFromStorage();
    renderAllNotes();
  })();
</script>
</body>
</html>
